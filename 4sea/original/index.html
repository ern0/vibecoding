<html>
	<!--- Head section --->
	<head>
		<title >To See The Sun</title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8; width=device-width, initial-scale=0.9" />
		<!-- <script src="scripts/js/jquery.js" type="text/javascript"></script> -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <script src="scripts/js/vars.js" type="text/javascript"></script>
		<script src="scripts/js/functions.js" type="text/javascript"></script>
        <script src="scripts/js/bootstrap.min.js" type="text/javascript"></script>
		<link rel="stylesheet" type="text/css" href="style/tss-style.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	</head>
	
	<!--- Body section --->
	<body onload="baseLoad()">
		<div id="Main" class="container-fluid">
			
			<div id="Presenter">&nbsp;</div>
			
			<div id="Header" class="row">
				<div id="Menu" >
					<div id="leftMenu" class="col-xs-6"></div>
					<div id="rightMenu" class="col-xs-6">
						<div class="col-xs-4"><input type="hidden" id="Hidden" value="showed" /></div>
						<div class="col-xs-5" id="Player"></div>
						
						<!-- soundcloud button at the top-right --> 
						<div class="col-xs-1 right"><img src="./photos/icons/scloud.svg" onclick="soundcloudShow()" class="pointer"/></div>
						<!-- facebook button at the top-right --> 
						<div class="col-xs-1"><a href="https://facebook.com/toseethesun" target="_blank" class="fa fa-facebook"></a></div>
						<!-- Menu button at the top-right --> 
						<div class="col-xs-1"><a class="fa fa-rss pointer" onclick="popupShow()"></a></div>
						
					</div>
				</div>
				<div id="Title" class="row"><p id='first'>Zoltán - for the World: </p><p id='second'>To See The Sun</p></div>
			</div>
			
			<div id="Footer" style="padding-left: 50px;">© Zoltan Lengyel
			
					<div id="fb-root" style="display: inline; text-align: right" ></div>
						<script>(function(d, s, id) {
						  var js, fjs = d.getElementsByTagName(s)[0];
						  if (d.getElementById(id)) return;
						  js = d.createElement(s); js.id = id;
						  js.src = 'https://connect.facebook.net/hu_HU/sdk.js#xfbml=1&version=v3.0';
						  fjs.parentNode.insertBefore(js, fjs);
						}(document, 'script', 'facebook-jssdk'));</script>
					<div style="display: inline; text-align: right" class="fb-like" data-href="https://toseethesun.com" data-layout="button" data-action="like" data-size="small" data-show-faces="true" data-share="true"></div>
				</div>
				
			</div>
			<img id="BgImg" />
			
		</div>
		
		<!-- Sign in form -->
		<div id="Popup" class="modal fade" id="modalLoginForm" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header text-center">
						<h4 class="modal-title w-100 font-weight-bold">Sign up for newsletter</h4>
						<button type="button" class="close" data-dismiss="modal" aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>
					<div class="modal-body">
						<div id="Popup-content">
							<table>
                                <tr>
									<td class="icon">	<i class="fa fa-user-o prefix grey "></i></td>
									<td><input type="text" id="signupFormfname" class="form-control validate" placeholder="Your First Name" width="70%"></td>
								</tr>
								<tr>
									<td class="icon">	<i class="fa fa-user-o prefix grey "></i></td>
									<td><input type="text" id="signupFormlname" class="form-control validate" placeholder="Your Last Name" ></td>
								</tr>
								<tr>
									<td class="icon">	<i class="fa fa-user-circle-o prefix grey "></i></td>
									<td><input type="text" id="signupFormuname" class="form-control validate" placeholder="Your username" ></td>
								</tr>
								<tr>
									<td class="icon">	<i class="fa fa-envelope-o prefix grey "></i></td>
									<td><input type="email" id="signupFormemail" class="form-control validate" placeholder="Your email address" ></td>
								</tr>
								
							</table>
						</div>
					</div>
					<div class="modal-footer d-flex justify-content-center">
						<button class="btn btn-default" id="signupButton" onclick="signUp()">Sign up</button>
					</div>
				</div>
			</div>
		</div>
		
		<!-- end of sign in form -->
		
		<!-- soundcloud pages -->
		
		<div id="soundcloud" class="modal fade" id="modalLoginForm" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
           <div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header text-center">
						<h4 class="modal-title w-100 font-weight-bold">Zoltán's Soundcloud Pages</h4>
						<button type="button" class="close" data-dismiss="modal" aria-label="Close">
							<span aria-hidden="true">&times;</span>
						</button>
					</div>
					<div class="modal-body">
						<div id="Popup-content">
							<table>
								<tr>
									<td class="icon"><iframe allowtransparency="true" scrolling="no" frameborder="no" src="https://w.soundcloud.com/icon/?url=http%3A%2F%2Fsoundcloud.com%2Ftoseethesun&color=orange&size=32" style="width: 32px; height: 32px;"></iframe></td>
									<td><p>toseethesun project</p></td>
								</tr>
								<tr>
                                    <td class="icon"><iframe allowtransparency="true" scrolling="no" frameborder="no" src="https://w.soundcloud.com/icon/?url=http%3A%2F%2Fsoundcloud.com%2Fnegy_evszak&color=orange&size=32" style="width: 32px; height: 32px;"></iframe></td>
                                    <td><p>Four Seasons</p></td>
								</tr>
								<tr>
                                    <td class="icon"><iframe allowtransparency="true" scrolling="no" frameborder="no" src="https://w.soundcloud.com/icon/?url=http%3A%2F%2Fsoundcloud.com%2Fzoltan_lengyel&color=orange&size=32" style="width: 32px; height: 32px;"></iframe></td>
                                    <td><p>Zoltán Lengyel</p></td>
								</tr>
							</table>
						</div>
					</div>
					<div class="modal-footer d-flex justify-content-center">
						<button class="btn btn-default" onclick="soundcloudClose()">Close</button>
					</div>
				</div>
			</div>
		</div> 
		
	</body>
</html>
